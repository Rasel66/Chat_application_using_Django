{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
{% if messages %}
  <div class="max-w-2xl mx-auto mt-4">
    {% for message in messages %}
      <div class="p-3 mb-3 rounded-lg 
                  {% if message.tags == 'success' %} bg-green-100 text-green-700 
                  {% elif message.tags == 'error' %} bg-red-100 text-red-700 
                  {% else %} bg-gray-100 text-gray-700 {% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

<div class="max-w-md mx-auto mt-8">
  <div class="bg-white shadow-md rounded-lg p-6">
    <h2 class="text-xl font-semibold mb-4">Sign in</h2>

    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>
        <label class="block text-sm font-medium">Username</label>
        <input name="username" autofocus required
               class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-2" />
      </div>

      <div>
        <label class="block text-sm font-medium">Password</label>
        <input name="password" type="password" required
               class="mt-1 block w-full rounded-md border-gray-200 shadow-sm p-2" />
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center text-sm">
          <input type="checkbox" name="remember" class="mr-2" /> Remember me
        </label>
        <a href="{% url 'password_reset' %}" class="text-sm text-blue-600">Forgot password?</a>
      </div>

      <button type="submit" class="w-full mt-2 bg-blue-500 text-white py-2 rounded-md">
        Login
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      Don’t have an account?
      <a href="{% url 'signup' %}" class="text-blue-600">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
