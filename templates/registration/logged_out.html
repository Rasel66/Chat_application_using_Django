{% extends "base.html" %}
{% block title %}Logged Out{% endblock %}

{% block content %}
{% if messages %}
  <div class="max-w-2xl mx-auto mt-4">
    {% for message in messages %}
      <div class="p-3 mb-3 rounded-lg 
                  {% if message.tags == 'success' %} bg-green-100 text-green-700 
                  {% elif message.tags == 'error' %} bg-red-100 text-red-700 
                  {% else %} bg-gray-100 text-gray-700 {% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

<div class="min-h-[80vh] flex flex-col items-center justify-center">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md text-center">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4">You’ve been logged out</h2>
    <p class="text-gray-600 mb-6">Thank you for using ChatConnect.</p>

    <a href="{% url 'login' %}" 
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition">
      Log In Again
    </a>
  </div>
</div>
{% endblock %}
