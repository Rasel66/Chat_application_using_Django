{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Chat App {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        fill="none" viewBox="0 0 24 24" stroke-width="1.5" 
                        stroke="currentColor" class="w-8 h-8 text-blue-500">
                        <path stroke-linecap="round" stroke-linejoin="round" 
                            d="M12 20.25c4.97 0 9-3.358 9-7.5s-4.03-7.5-9-7.5S3 8.608 3 12.75c0 2.088 1.032 3.974 2.743 5.322-.099.577-.407 1.5-.993 2.678a.75.75 0 00.868 1.068c1.77-.414 2.898-.963 3.575-1.372A9.684 9.684 0 0012 20.25z" />
                    </svg>
                    <span class="font-bold text-lg text-gray-800">Chat Connect</span>
                </div>

                <nav class="hidden md:flex space-x-6">
                    <a href="" class="text-gray-700 hover:text-blue-500 transition">Home</a>
                    <a href="" class="text-gray-700 hover:text-blue-500 transition">Profile</a>
                    <a href="" class="text-gray-700 hover:text-blue-500 transition">Chats</a>
                </nav>

                <div class="flex items-center space-x-4">
                    <span class="hidden sm:inline text-sm text-gray-500">Hi, Rasel</span>
                    <a href="" 
                        class="text-sm bg-blue-500 text-white px-3 py-1.5 rounded-md hover:bg-blue-600 transition">
                        Logout
                    </a>
                    <a href="" 
                        class="text-sm bg-blue-500 text-white px-3 py-1.5 rounded-md hover:bg-blue-600 transition">
                        Login
                    </a>

                    <button class="md:hidden focus:outline-none" id="menu-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                                stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" 
                                    d="M3.75 5.25h16.5m-16.5 6.75h16.5m-16.5 6.75h16.5" />
                        </svg>
                    </button>
                </div>
            </div> 
        </div>
        <div id="mobile-menu" class="md:hidden hidden bg-white border-t">
            <nav class="px-4 py-3 space-y-2">
                <a href="" class="block text-gray-700 hover:text-blue-500">Home</a>
                <a href="" class="block text-gray-700 hover:text-blue-500">Chats</a>
                <a href="" class="block text-gray-700 hover:text-blue-500">Profile</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.getElementById("menu-btn").addEventListener('click', function(){
            document.getElementById('mobile-menu').classList.toggle('hidden')
        });
    </script>
    
</body>
</html>
